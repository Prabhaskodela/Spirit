name: Build SpiritHUB Android app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "app.css"
      - "premium.css"
      - "ai.js"
      - "backup.js"
      - "spirit-ai.js"
      - "config.js"
      - "manifest.json"
      - "assets/**"
      - "mobile/**"
      - ".github/workflows/android-app.yml"
  push:
    paths:
      - "index.html"
      - "app.js"
      - "app.css"
      - "premium.css"
      - "ai.js"
      - "backup.js"
      - "spirit-ai.js"
      - "config.js"
      - "manifest.json"
      - "assets/**"
      - "mobile/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Build the packaged app
        working-directory: mobile
        run: |
          npm ci
          npm run build:web
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spirithub-android-debug-apk
          path: mobile/android/app/build/