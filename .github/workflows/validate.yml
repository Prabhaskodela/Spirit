name: Validate SpiritHUB

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check website JavaScript syntax
        run: |
          for file in app.js ai.js backup.js spirit-ai.js config.js; do
            node --input-type=module --check < "$file"
          done
      - name: Check Spirit AI edge function syntax
        run: node --check < supabase/functions/spirit-ai/index.ts
      - name: Check service worker syntax
        run: |
          node --check sw.js
          node --check hub/sw.js
      - name: Validate page templates, assets, manifests, and schema hooks
        run: node scripts/validate.mjs
