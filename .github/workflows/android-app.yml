name: Build SpiritHUB Hub Android app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app-config.js"
      - "app.js"
      - "styles.css"
      - "hub/**"
      - "icons/**"
      - "spirit-wordmark.png"
      - "mobile/**"
      - ".github/workflows/android-app.yml"
  push:
    branches: [main]
    paths:
      - "app-config.js"
      - "app.js"
      - "styles.css"
      - "hub/**"
      - "icons/**"
      - "spirit-wordmark.png"
      - "mobile/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Build the packaged /hub/ app
        working-directory: mobile
        run: |
          npm ci
          npm install-scripts approve esbuild
          node --check scripts/build-web.mjs
          npm run build:web
          test -f www/index.html
          grep -q 'class="hub-route"' www/index.html
          grep -q 'src="./app.js' www/index.html
          grep -q 'href="./styles.css' www/index.html
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk "Spirit hub Finalised.apk"
          test -s "Spirit hub Finalised.apk"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Spirit hub Finalised
          path: mobile/Spirit hub Finalised.apk
          if-no-files-found: error
